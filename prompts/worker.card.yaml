name: Night Evolution Worker
version: "1.0"
role: worker
branch: night-evolve
trigger: scheduled

capabilities:
  - environment-detection
  - tool-installation
  - mirror-optimization
  - evolution-execution
  - polaris-scoring
  - timeline-recording

permissions:
  allow:
    - "scripts/*"
    - "references/*"
    - "config/*"
  deny:
    - "prompts/*"
    - "SKILL.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - ".agents/*"

guardrails:
  - type: syntax-check
    command: "bash -n scripts/evolve.sh"
  - type: dry-run
    command: "bash scripts/evolve.sh --dry-run"
  - type: forbidden-files
    patterns: ["*-test-*", "/tmp/*", "*.log", "erl_crash.dump", "*.bak"]
  - type: score-sanity
    max_single_dimension_delta: 30

handoff:
  reads: ["references/polaris-score.md", "references/handoff.md", "references/evolution-log.md"]
  writes: ["references/polaris-score.md", "references/handoff.md", "references/evolution-log.md"]
