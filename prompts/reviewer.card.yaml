name: PR Reviewer
version: "1.0"
role: reviewer
branch: none
trigger: manual

capabilities:
  - code-review
  - verification
  - pr-merge
  - pr-reject

permissions:
  allow:
    - "none"
  deny:
    - "**"

guardrails:
  - type: read-only
    description: "Reviewer cannot modify any code"
  - type: verification-checklist
    items:
      - "bash -n scripts/evolve.sh"
      - "bash scripts/evolve.sh --dry-run"
      - "no forbidden files in PR"
      - "polaris score reasonability"
      - "timeline integrity (events >= 20)"

handoff:
  reads: ["**"]
  writes: []
