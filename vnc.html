<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Remote Desktop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
.header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 16px; font-weight: 600; }
.status { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #0f3460; }
.status.connected { background: #1a8f3c; }
.container { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.info { text-align: center; max-width: 500px; padding: 40px; }
.info h2 { font-size: 22px; margin-bottom: 16px; }
.info p { color: #888; line-height: 1.6; margin-bottom: 12px; }
.btn { display: inline-block; padding: 12px 32px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; margin-top: 16px; }
.btn:hover { background: #c73652; }
</style>
</head>
<body>
<div class="header">
<h1>🖥️ Sandbox Remote Desktop</h1>
<span class="status" id="status">Connecting...</span>
</div>
<div class="container">
<div class="info" id="info">
<h2>远程桌面连接</h2>
<p>正在尝试连接到 sandbox 的 VNC 服务...</p>
<p>如果连接失败，说明预览代理不支持 WebSocket 转发。</p>
<a class="btn" id="connectBtn" href="#">连接桌面</a>
</div>
</div>
<script>
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');
const btn = document.getElementById('connectBtn');

// Try to detect the correct WebSocket URL
const wsProtocols = ['ws://', 'wss://'];
const host = window.location.hostname;
const port = 6080;

// Try direct connection
btn.onclick = function() {
    const wsUrl = `ws://${host}:${port}/websockify`;
    statusEl.textContent = 'Connecting to ' + wsUrl;
    
    try {
        const ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            statusEl.textContent = 'Connected!';
            statusEl.className = 'status connected';
            // Redirect to actual noVNC
            window.location.href = `http://${host}:${port}/vnc.html?autoconnect=true`;
        };
        ws.onerror = () => {
            statusEl.textContent = 'Direct connection failed';
            infoEl.innerHTML = '<h2>无法直接连接</h2><p>预览代理不支持 WebSocket 转发。</p><p>你需要通过 VNC 客户端连接到 sandbox 的 IP:5900</p>';
        };
        ws.onclose = () => {
            statusEl.textContent = 'Connection closed';
        };
    } catch(e) {
        statusEl.textContent = 'Error: ' + e.message;
    }
};
</script>
</body>
</html>
